name: refresh-profile

on:
  schedule:
    # 每天两次（UTC 01:17 / 17:17 ≈ 北京时间 09:17 / 次日 01:17）
    - cron: '17 1 * * *'
    - cron: '17 17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh.yml'
      - 'assets/fonts/**'

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          python -m pip install --quiet pillow playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji >/dev/null || true
          fc-cache -f >/dev/null || true

      - name: Collect data + assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/github_data.py
          python scripts/build_assets.py

      - name: Render page
        run: |
          python scripts/render.py
          python scripts/shot.py "$PWD/preview/render.html" "$PWD/assets/hero.png" 1012 852 2
          python - <<'EOF'
          from PIL import Image
          import os
          p = 'assets/hero.png'
          im = Image.open(p).resize((1012, 852), Image.LANCZOS).convert('P').quantize(128)
          im.save(p, optimize=True)
          print('hero.png', os.path.getsize(p), 'bytes')
          EOF

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hero.png assets/data.json assets/shot-*.png
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh profile $(date -u +%Y-%m-%d)"
            git push origin HEAD:main || (git pull --rebase && git push origin HEAD:main)
          fi
